version: '3.8'

services:
  # PostgreSQL Database (Optional production backend)
  db:
    image: postgres:16-alpine
    container_name: sentinelai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelai
      POSTGRES_PASSWORD: sentinelai_secure_password
      POSTGRES_DB: sentinelai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelai -d sentinelai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend SOC Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://sentinelai:sentinelai_secure_password@db:5432/sentinelai_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
      - JWT_SECRET=${JWT_SECRET:-sentinelai_super_secret_jwt_production_key_32_bytes}
    ports:
      - "8000:8000"

  # React Frontend (Nginx Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
